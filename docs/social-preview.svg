<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="WeAscend — personal progress system">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070812"/>
      <stop offset="0.5" stop-color="#0a0b18"/>
      <stop offset="1" stop-color="#151029"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#866bff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#866bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#866bff"/>
      <stop offset="1" stop-color="#32d6c5"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#866bff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <style>
      .t { font-family: 'Segoe UI', 'Inter', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1060" cy="150" r="460" fill="url(#glow)"/>

  <g transform="translate(116,214)">
    <rect width="92" height="92" rx="6" fill="#0d0f1c" stroke="#866bff" stroke-width="2" transform="rotate(45 46 46)"/>
    <text class="t" x="46" y="63" text-anchor="middle" font-size="44" font-weight="700" fill="#b5a7ff">W</text>
  </g>

  <text class="t" x="270" y="248" font-size="15" fill="#32d6c5" letter-spacing="5" font-weight="600">PERSONAL PROGRESS SYSTEM</text>
  <text class="t" x="266" y="346" font-size="86" font-weight="700" fill="#f2f3fa" letter-spacing="4">WeAscend</text>
  <text class="t" x="270" y="398" font-size="25" fill="#9aa0bf">Plan concrete work. Clear it. Watch skills, XP and rank grow.</text>

  <rect x="270" y="436" width="180" height="3" fill="url(#rule)"/>

  <g class="t" font-size="16" fill="#7d84a8" letter-spacing="1.2">
    <text x="270" y="512">Append-only XP ledger</text>
    <text x="270" y="544">Quests · Bosses · Ranks E → S</text>
    <text x="270" y="576">Next.js PWA · Expo · Edge API</text>
  </g>

  <g class="t" font-size="14" fill="#5f6787" letter-spacing="0.8">
    <text x="1164" y="596" text-anchor="end">weascend.wesystemlabs.com</text>
  </g>
</svg>
